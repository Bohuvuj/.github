<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Subash: A fragrance storefront, from catalogue to checkout. Live.">
  <title>Subash</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f5c451" stop-opacity=".22"/><stop offset="1" stop-color="#f5c451" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 400 34px 'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif; fill: #f2f1ef; }
    .body { font: 400 16px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #b4b6bd; }
    .tag { font: 500 13px 'JetBrains Mono','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #b4b6bd; }
    .status { font: 600 13px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #f5c451; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.65} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#19191c"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <path d="M516 30 L540 44 V72 L516 86 L492 72 V44 Z" fill="#f5c451" fill-opacity=".1" stroke="#f5c451" stroke-width="1.5"/>
    <g transform="translate(516 58)"><g transform="translate(-13.0 -13.0) scale(1.0833)" fill="none" stroke="#f5c451" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1" />
  <circle cx="12" cy="8" r="2" />
  <path d="M12 10v12" />
  <path d="M12 22c4.2 0 7-1.667 7-5-4.2 0-7 1.667-7 5Z" />
  <path d="M12 22c-4.2 0-7-1.667-7-5 4.2 0 7 1.667 7 5Z" /></g></g>
    <text x="32" y="66" class="title">Subash</text>
    <text x="32" y="104" class="body">A fragrance storefront, from catalogue</text><text x="32" y="128" class="body">to checkout.</text>
    <rect x="32" y="150" width="98" height="28" rx="14" fill="#26262b"/><text x="81" y="169" class="tag" text-anchor="middle">TypeScript</text><rect x="138.0" y="150" width="57" height="28" rx="14" fill="#26262b"/><text x="166" y="169" class="tag" text-anchor="middle">React</text>
    <text x="548" y="169" class="status" text-anchor="end">Live</text>
    <circle cx="508" cy="164" r="4.5" fill="#f5c451" class="dot"/>
    <circle cx="508" cy="164" r="4.5" fill="#f5c451"/>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#2a2b30"/>
  </g>
</svg>
