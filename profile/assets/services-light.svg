<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="What we build: web platforms, custom software, mobile apps, cloud systems">
  <title>What we build</title>
  <style>
    .h { font: 700 19px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #141416; }
    .b { font: 400 15px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #4a4d57; }
    .ic { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translate(0,0)} 50%{transform:translate(0,-3px)} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect x=".5" y=".5" width="1199" height="169" rx="20" fill="#ffffff" stroke="#e4e1dc"/>
  <g transform="translate(54 52)"><g class="ic" style="animation-delay:-0.0s"><rect x="-18" y="-13" width="36" height="26" rx="4" fill="none" stroke="#dd2e44" stroke-width="2"/><path d="M-18 -5 H18" stroke="#dd2e44" stroke-width="2"/><circle cx="-13" cy="-9" r="1.4" fill="#dd2e44"/><circle cx="-8" cy="-9" r="1.4" fill="#dd2e44"/></g></g><text x="90" y="59" class="h">Web platforms</text><text x="34" y="108" class="b">Dashboards, portals and</text><text x="34" y="130" class="b">storefronts people use daily.</text><path d="M300 34 V136" stroke="#e4e1dc"/><g transform="translate(354 52)"><g class="ic" style="animation-delay:-1.5s"><path d="M-8 -10 L-17 0 L-8 10 M8 -10 L17 0 L8 10 M3 -14 L-3 14" fill="none" stroke="#f5c451" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="390" y="59" class="h">Custom software</text><text x="334" y="108" class="b">The internal tools a team</text><text x="334" y="130" class="b">actually runs on.</text><path d="M600 34 V136" stroke="#e4e1dc"/><g transform="translate(654 52)"><g class="ic" style="animation-delay:-3.0s"><rect x="-10" y="-17" width="20" height="34" rx="4" fill="none" stroke="#ff8091" stroke-width="2"/><path d="M-3 12 H3" stroke="#ff8091" stroke-width="2" stroke-linecap="round"/></g></g><text x="690" y="59" class="h">Mobile apps</text><text x="634" y="108" class="b">Android and iPhone, offline</text><text x="634" y="130" class="b">first when the field needs it.</text><path d="M900 34 V136" stroke="#e4e1dc"/><g transform="translate(954 52)"><g class="ic" style="animation-delay:-4.5s"><path d="M-12 10 H11 A8 8 0 0 0 9 -6 A11 11 0 0 0 -12 -2 A6 6 0 0 0 -12 10 Z" fill="none" stroke="#dd2e44" stroke-width="2" stroke-linejoin="round"/></g></g><text x="990" y="59" class="h">Cloud systems</text><text x="934" y="108" class="b">Databases, backups, monitoring:</text><text x="934" y="130" class="b">the part nobody sees.</text>
</svg>
