<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Autletto: Own online store for Facebook and Instagram sellers: stock, bKash, courier booking. Live.">
  <title>Autletto</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f5c451" stop-opacity=".22"/><stop offset="1" stop-color="#f5c451" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 400 34px 'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif; fill: #141416; }
    .body { font: 400 16px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #4a4d57; }
    .tag { font: 500 13px 'JetBrains Mono','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #4a4d57; }
    .status { font: 600 13px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #8a5d00; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.65} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#ffffff"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <path d="M516 30 L540 44 V72 L516 86 L492 72 V44 Z" fill="none" stroke="#f5c451" stroke-width="2"/>
    <text x="32" y="66" class="title">Autletto</text>
    <text x="32" y="104" class="body">Own online store for Facebook and Instagram</text><text x="32" y="128" class="body">sellers: stock, bKash, courier booking.</text>
    <rect x="32" y="150" width="73" height="28" rx="14" fill="#f2f1ef"/><text x="69" y="169" class="tag" text-anchor="middle">Next.js</text><rect x="113.39999999999999" y="150" width="98" height="28" rx="14" fill="#f2f1ef"/><text x="162" y="169" class="tag" text-anchor="middle">TypeScript</text><rect x="219.39999999999998" y="150" width="82" height="28" rx="14" fill="#f2f1ef"/><text x="260" y="169" class="tag" text-anchor="middle">Payments</text>
    <text x="548" y="169" class="status" text-anchor="end">Live</text>
    <circle cx="508" cy="164" r="4.5" fill="#f5c451" class="dot"/>
    <circle cx="508" cy="164" r="4.5" fill="#f5c451"/>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#e4e1dc"/>
  </g>
</svg>
