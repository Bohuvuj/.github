<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Perfume Vault: A perfume storefront with its own admin and content tools. Live.">
  <title>Perfume Vault</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff8091" stop-opacity=".22"/><stop offset="1" stop-color="#ff8091" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 400 34px 'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif; fill: #141416; }
    .body { font: 400 16px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #4a4d57; }
    .tag { font: 500 13px 'JetBrains Mono','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #4a4d57; }
    .status { font: 600 13px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #b83a52; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.65} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
