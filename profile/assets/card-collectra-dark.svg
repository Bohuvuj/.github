<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="200" viewBox="0 0 1180 200" role="img" aria-label="Collectra CMS: Collections and hire-purchase accounts for retail branches, on the web, Android and iPhone, with offline capture in the field. Live.">
  <title>Collectra CMS</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ee4a5e" stop-opacity=".22"/><stop offset="1" stop-color="#ee4a5e" stop-opacity="0"/></radialGradient>
