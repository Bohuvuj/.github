    .tag { font: 500 13px 'JetBrains Mono','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #b4b6bd; }
    .status { font: 600 13px Inter,'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #ff7385; }
